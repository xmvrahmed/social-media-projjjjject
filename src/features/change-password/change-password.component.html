<section class="password-card">
  <a routerLink="/profile" class="back-link">← Back to profile</a>
  <h1>Change password</h1>
  <p class="subtitle">Choose a new password for your Route Posts account.</p>

  @if (errorMessage()) {
    <p class="message error" role="alert">{{ errorMessage() }}</p>
  }
  @if (successMessage()) {
    <p class="message success" role="status">{{ successMessage() }}</p>
  }

  <form [formGroup]="passwordForm" (ngSubmit)="submit()">
    <label>
      <span>Current password</span>
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>

    <label>
      <span>New password</span>
      <input type="password" formControlName="newPassword" autocomplete="new-password" />
      @if (passwordForm.get('newPassword')?.touched && passwordForm.get('newPassword')?.invalid) {
        <small>Use 8–16 characters with uppercase, lowercase, and a number.</small>
      }
    </label>

    <label>
      <span>Confirm new password</span>
      <input type="password" formControlName="confirmPassword" autocomplete="new-password" />
      @if (passwordForm.get('confirmPassword')?.touched && passwordsMismatch) {
        <small>Passwords do not match.</small>
      }
    </label>

    <button type="submit" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Saving...' : 'Update password' }}
    </button>
  </form>
</section>
