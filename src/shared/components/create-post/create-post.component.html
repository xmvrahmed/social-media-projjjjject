<div class="rounded-2xl border border-slate-200/90 bg-white p-4 sm:p-5 shadow-xs mb-5 transition-shadow hover:shadow-sm">
  <div class="flex items-center gap-3 mb-3">
    <img [src]="authService.currentUser()?.photo || 'route.png'"
         [alt]="userDisplayName"
         class="h-10 w-10 shrink-0 rounded-full object-cover border border-slate-200 shadow-2xs"
         (error)="$any($event.target).src = 'route.png'" />
    <div class="min-w-0">
      <p class="text-sm font-bold text-slate-900 truncate leading-tight">
        {{ userDisplayName }}
      </p>
      <div class="mt-1 inline-flex items-center gap-1.5 rounded-full bg-slate-100 px-2.5 py-0.5 text-[11px] font-semibold text-slate-600">
        <svg class="h-3 w-3 text-slate-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="2" y1="12" x2="22" y2="12"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
        <span>Public Feed</span>
      </div>
    </div>
  </div>

  <div class="w-full">
    <textarea [ngModel]="body()" (ngModelChange)="body.set($event)" (keydown)="onContentKeydown($event)" rows="3"
              [placeholder]="'What\'s on your mind, ' + (authService.currentUser()?.name?.split(' ')?.at(0) || 'there') + '?'"
              class="w-full resize-none rounded-xl border border-slate-200/70 bg-slate-50/50 p-3 text-sm sm:text-base text-slate-800 placeholder:text-slate-400 outline-none transition focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-100"></textarea>
  </div>

  @if (previewUrl()) {
    <div class="relative mt-3 rounded-2xl overflow-hidden border border-slate-200 bg-slate-950/5 max-h-80 flex items-center justify-center">
      <img [src]="previewUrl()" alt="Attachment preview" class="w-full object-cover max-h-80" />
      <button type="button" (click)="removeFile()" title="Remove image"
              class="absolute top-2.5 right-2.5 flex h-8 w-8 items-center justify-center rounded-full bg-slate-900/75 text-white backdrop-blur-xs transition hover:bg-slate-900">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  }

  @if (errorMessage()) {
    <div class="mt-3 rounded-xl bg-rose-50 border border-rose-200 px-3.5 py-2 text-xs font-semibold text-rose-700">
      {{ errorMessage() }}
    </div>
  }

  <div class="mt-3.5 flex items-center justify-between border-t border-slate-100 pt-3">
    <div class="flex items-center gap-1 sm:gap-2">
      <label class="flex cursor-pointer items-center gap-2 rounded-xl px-3 py-1.5 text-xs sm:text-sm font-semibold text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition">
        <svg class="h-5 w-5 text-emerald-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
          <circle cx="9" cy="9" r="2"/>
          <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
        </svg>
        <span>Photo</span>
        <input type="file" accept="image/*" (change)="onFileSelected($event)" class="hidden" />
      </label>

      <div class="hidden sm:flex items-center gap-1.5 rounded-xl px-3 py-1.5 text-xs sm:text-sm font-semibold text-slate-500">
        <svg class="h-5 w-5 text-amber-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
          <line x1="9" y1="9" x2="9.01" y2="9"/>
          <line x1="15" y1="9" x2="15.01" y2="9"/>
        </svg>
        <span>Feeling</span>
      </div>
    </div>

    <button type="button" (click)="onSubmit()"
            [disabled]="isSubmitting() || (!body().trim() && !selectedFile())"
            class="flex items-center gap-2 rounded-xl bg-blue-600 px-5 py-2 text-xs sm:text-sm font-bold text-white shadow-xs transition hover:bg-blue-700 active:scale-95 disabled:opacity-40 disabled:pointer-events-none">
      @if (isSubmitting()) {
        <svg class="h-4 w-4 animate-spin text-white" viewBox="0 0 24 24" fill="none">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>Publishing...</span>
      } @else {
        <span>Post</span>
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      }
    </button>
  </div>
</div>
